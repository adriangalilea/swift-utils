# The gate on the way in. Releases fire on a tag, which is AFTER the fact, so
# this is the only thing standing between a broken main and a broken tag.
# check = format + release build + tests; the diff step makes format-clean a
# hard requirement (swift-format changes nothing).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    uses: adriangalilea/ci/.github/workflows/mise.yml@c2ba9058dbad2cc8589da7419f2bd8b30ad9334a # v1.2.0
    permissions:
      contents: read
