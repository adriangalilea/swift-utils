# The gate, and the release after it. Three jobs side by side, so the wall time
# is the slowest of them, not the sum: check (format + release build + tests on
# macOS) and the iOS and tvOS builds of every library that claims them (`mise
# run platforms`, one table). Each keeps its build directory between runs, so a
# push recompiles what it touched. The diff step makes format-clean a hard
# requirement (swift-format changes nothing).
#
# A push to main runs on the runner the repo variable MAC_RUNNER names, when it
# is set (Adrian's Mac, a launchd agent of his user, switched on and off by
# ~/self/mac/runner.sh; nothing here touches a secret), else on GitHub's
# macos-26. A pull request always runs on macos-26: the repo is public, and a
# fork's code never runs on the Mac.
#
# A green push to main is released at once: next-version reads the version from
# the commits since the last tag (in 0.x a break bumps the minor, anything else
# worth a release the patch, docs and the like none), and release.yml creates
# the tag and its notes in one call. Nothing is tagged by hand.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # main again, by hand (`gh workflow run ci -R adriangalilea/swift-utils`):
  # a push whose run was cancelled is released by its rerun.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    uses: adriangalilea/ci/.github/workflows/mise.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      runner: ${{ github.event_name != 'pull_request' && vars.MAC_RUNNER || 'macos-26' }}
      cache: .build
    permissions:
      contents: read

  platforms:
    strategy:
      matrix:
        platform: [iOS, tvOS, watchOS]
    uses: adriangalilea/ci/.github/workflows/mise.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      runner: ${{ github.event_name != 'pull_request' && vars.MAC_RUNNER || 'macos-26' }}
      task: platforms ${{ matrix.platform }}
      cache: .build/platforms
    permissions:
      contents: read

  version:
    needs: [check, platforms]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: adriangalilea/ci/.github/workflows/next-version.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      v-prefix: false
    permissions:
      contents: read

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: adriangalilea/ci/.github/workflows/release.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    with:
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
