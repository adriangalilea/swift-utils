# The gate, and the release after it. Three jobs side by side, so the wall time
# is the slowest of them, not the sum: check (format + release build + tests on
# macOS) and the iOS and tvOS builds of every library that claims them (`mise
# run platforms`, one table). Each keeps its build directory between runs, so a
# push recompiles what it touched. The diff step makes format-clean a hard
# requirement (swift-format changes nothing).
#
# A green push to main is released at once: next-version reads the version from
# the commits since the last tag (in 0.x a break bumps the minor, anything else
# worth a release the patch, docs and the like none), and release.yml creates
# the tag and its notes in one call. Nothing is tagged by hand.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    uses: adriangalilea/ci/.github/workflows/mise.yml@b2324769d05804a2ce77a197ec2d0d0cb4f6ed87 # v1.9.0
    with:
      cache: .build
    permissions:
      contents: read

  platforms:
    strategy:
      matrix:
        platform: [iOS, tvOS]
    uses: adriangalilea/ci/.github/workflows/mise.yml@b2324769d05804a2ce77a197ec2d0d0cb4f6ed87 # v1.9.0
    with:
      task: platforms ${{ matrix.platform }}
      cache: .build/platforms
    permissions:
      contents: read

  version:
    needs: [check, platforms]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: adriangalilea/ci/.github/workflows/next-version.yml@b2324769d05804a2ce77a197ec2d0d0cb4f6ed87 # v1.9.0
    with:
      v-prefix: false
    permissions:
      contents: read

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: adriangalilea/ci/.github/workflows/release.yml@b2324769d05804a2ce77a197ec2d0d0cb4f6ed87 # v1.9.0
    with:
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
