# A Swift library's version IS its git tag: pushing one verifies the package
# and publishes the notes, through adriangalilea/ci.
name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  verify:
    uses: adriangalilea/ci/.github/workflows/swift.yml@7018e276a6c519cef370fb1eeb1b8b5ee34da500 # v1.2.2
    permissions:
      contents: read

  release:
    needs: verify
    uses: adriangalilea/ci/.github/workflows/release.yml@7018e276a6c519cef370fb1eeb1b8b5ee34da500 # v1.2.2
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
