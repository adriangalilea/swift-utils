# A Swift library's version IS its git tag: pushing one verifies the package
# and publishes the notes, through adriangalilea/ci.
name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  verify:
    uses: adriangalilea/ci/.github/workflows/swift.yml@69c560ad05a9a3f62cdb9a33cf4307cc6b485c1d # v1.1.0
    permissions:
      contents: read

  release:
    needs: verify
    uses: adriangalilea/ci/.github/workflows/release.yml@69c560ad05a9a3f62cdb9a33cf4307cc6b485c1d # v1.1.0
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
