# A Swift library's version IS its git tag: pushing one verifies the package
# and publishes the notes, through adriangalilea/ci.
name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  verify:
    uses: adriangalilea/ci/.github/workflows/swift.yml@aff0340f6067ae0013ad2304c3c1bb591d64ceb6 # v1.2.1
    permissions:
      contents: read

  release:
    needs: verify
    uses: adriangalilea/ci/.github/workflows/release.yml@aff0340f6067ae0013ad2304c3c1bb591d64ceb6 # v1.2.1
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
