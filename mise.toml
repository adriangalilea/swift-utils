# swift-utils verbs (`mise <task>` from the repo root; `mise tasks` lists them).
# check = format + build + test, what CI runs; format-clean is the gate.

[tasks.build]
description = "swift build (debug)"
run = "swift build"

[tasks.test]
description = "swift test"
run = "swift test"

[tasks.format]
description = "swift-format in place (the Xcode toolchain's, studio config: .swift-format)"
run = "xcrun swift-format --recursive Sources/ Tests/ --in-place"

[tasks.lint]
description = "swift-format lint, advisory (format-clean is the gate, not lint taste)"
run = "xcrun swift-format lint --recursive Sources/ Tests/"

[tasks.platforms]
description = "build each library for every platform it claims beyond macOS (swift build covers macOS), or only [platform]: iOS, tvOS or watchOS; the table is the one place a library's platforms are stated. CI runs each platform as its own job, in parallel with check"
usage = 'arg "[platform]" help="iOS, tvOS or watchOS; all when absent"'
run = '''
set -euo pipefail
only="${usage_platform:-}"
case "$only" in ""|iOS|tvOS|watchOS) ;; *) echo "platforms: iOS, tvOS or watchOS, not '$only'" >&2; exit 1 ;; esac
# library  platforms beyond macOS
#   Keymap      none: AppKit, Carbon, global hotkeys, a Mac's keyboard
#   OnePassword none: op is a Mac's command line, run as a child process
#   Biometrics  no tvOS: a TV has no LocalAuthentication, no finger, no face
#   watchOS     the grants and what they stand on (Log, Ink): a watch app asks for its permissions too
while read -r lib platforms; do
  for platform in $platforms; do
    [ -z "$only" ] || [ "$platform" = "$only" ] || continue
    echo "== $lib on $platform"
    xcodebuild -scheme "$lib" -destination "generic/platform=$platform" \
      -derivedDataPath .build/platforms build -quiet
  done
done <<'TABLE'
Ink iOS tvOS watchOS
PermissionGrants iOS tvOS watchOS
Log iOS tvOS watchOS
Terminal iOS tvOS
Syntax iOS tvOS
SyntaxLines iOS tvOS
Entitlement iOS tvOS
Colophon iOS tvOS
MediaSpec iOS tvOS
MarkdownText iOS tvOS
GitKit iOS tvOS
GitLocal iOS tvOS
GitViews iOS tvOS
Scores iOS tvOS
Biometrics iOS
TABLE
'''

[tasks.check]
description = "format + build (release) + test + the examples' headless laws: the macOS gate, fast enough to run before every push; CI adds `platforms` beside it"
run = [
  "mise run format",
  "swift build -c release",
  "mise run test",
  "swift run -c release --skip-build keymap-example --check",
  "echo 'swift-utils: check passed'",
]

[tasks.grant-example]
description = "PermissionGrants' shapes as a real, signed app with its own permissions and a helper to install (grant reset grant-example replays it)"
run = "bash scripts/grant-example-app.sh"

[tasks.markdown-snapshots]
description = "MarkdownText's fixtures drawn light and dark as PNGs into [dir] (default /tmp/md-fixtures): mac/ at a Mac's widths, iphone/ in the iPhone simulator"
usage = 'arg "[dir]" help="where the PNGs go"'
run = '''
set -euo pipefail
dir="${usage_dir:-/tmp/md-fixtures}"
MARKDOWN_SNAPSHOTS="$dir" swift test --filter 'MarkdownTextTests'
# By id: a package scheme's destinations do not resolve a device by its name.
phone=$(xcrun simctl list devices available -j \
  | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")][0].udid')
[ "$phone" != null ] || { echo "markdown-snapshots: no iPhone 17 Pro simulator" >&2; exit 1; }
TEST_RUNNER_MARKDOWN_SNAPSHOTS="$dir" xcodebuild test -scheme MarkdownTextTests \
  -destination "platform=iOS Simulator,id=$phone" \
  -derivedDataPath .build/markdown-snapshots -quiet
echo "markdown-snapshots: $dir/mac and $dir/iphone"
'''

[tasks.diff-snapshots]
description = "GitViews' DiffView drawn light and dark as PNGs into [dir] (default /tmp/diff-snapshots): mac/ at a Mac's widths, iphone/ in the iPhone simulator"
usage = 'arg "[dir]" help="where the PNGs go"'
run = '''
set -euo pipefail
dir="${usage_dir:-/tmp/diff-snapshots}"
GITVIEWS_SNAPSHOTS="$dir" swift test --filter 'GitViewsTests.Snapshots'
phone=$(xcrun simctl list devices available -j \
  | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")][0].udid')
[ "$phone" != null ] || { echo "diff-snapshots: no iPhone 17 Pro simulator" >&2; exit 1; }
TEST_RUNNER_GITVIEWS_SNAPSHOTS="$dir" xcodebuild test -scheme GitViewsTests \
  -destination "platform=iOS Simulator,id=$phone" \
  -derivedDataPath .build/diff-snapshots -quiet
echo "diff-snapshots: $dir/mac and $dir/iphone"
'''

[tasks.gitkit-fixtures]
description = "rebuild the scenario repository (scripts/gitkit-scenario.sh) and recapture Tests/GitKitTests/Fixtures/scenario, which GitKit's tests and the example's iPhone build read"
run = '''
set -euo pipefail
scripts/gitkit-scenario.sh /tmp/gitkit-scenario
base=$(git -C /tmp/gitkit-scenario/app rev-parse HEAD~2)
touched=Sources/Ink/MiddleTruncate.swift,Sources/Syntax/Syntax.swift,Sources/Ink/InkScrim.swift,Sources/Ink/Scrim.swift,Sources/Ink/HUDGlass.swift,scripts/grant-example-app.sh,Sources/Ink/InkBadge.swift,README.md,Sources/Ink/Resources/badge.png,Sources/Ink/Resources/ABOUT.txt,Vendor/cmark,NOTES.md,Tests/InkTests/InkBadgeTests.swift
out=Tests/GitKitTests/Fixtures/scenario
if [ -e "$out" ]; then trash "$out"; fi
swift run gitkit-capture /tmp/gitkit-scenario/app "$out" --agent-base "$base" --touched "$touched" --shows 6 --log 40
'''

[tasks.git-example]
description = "GitViewer, the git viewer example: on this Mac over [repository] (default ~/Developer/vigil), or with --ios in the iPhone simulator over the bundled capture"
usage = '''
arg "[repository]" help="a repository on this Mac"
flag "--ios" help="build and run in the iPhone 17 Pro simulator"
'''
dir = "Examples/GitViewer"
run = '''
set -euo pipefail
xcodegen generate --quiet
if [ "${usage_ios:-false}" = true ]; then
  phone=$(xcrun simctl list devices available -j \
    | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")][0].udid')
  [ "$phone" != null ] || { echo "git-example: no iPhone 17 Pro simulator" >&2; exit 1; }
  xcodebuild -project GitViewer.xcodeproj -scheme GitViewer -destination "platform=iOS Simulator,id=$phone" \
    -derivedDataPath build -quiet build
  xcrun simctl boot "$phone" 2>/dev/null || true
  # The Simulator app is not on every Mac (Xcode 27 leaves it out): the
  # simulator runs headless then, photographed with `xcrun simctl io`.
  open -b com.apple.iphonesimulator 2>/dev/null || echo "git-example: no Simulator app here; running headless" >&2
  xcrun simctl install "$phone" build/Build/Products/Debug-iphonesimulator/GitViewer.app
  xcrun simctl launch "$phone" com.adriangalilea.swift-utils.GitViewer
else
  xcodebuild -project GitViewer.xcodeproj -scheme GitViewer -destination 'platform=macOS' \
    -derivedDataPath build -quiet build
  repo="${usage_repository:-$HOME/Developer/vigil}"
  open -n build/Build/Products/Debug/GitViewer.app --args -repo "$repo"
fi
'''

[tasks.overlay]
description = "Run the keymap overlay example"
run = "swift run keymap-overlay"
